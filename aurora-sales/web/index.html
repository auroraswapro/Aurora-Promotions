<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora Sales</title>
<meta name="description" content="AI lead follow-up for Aurora Promotions, powered by Claude.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#625f8f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --logo:#8482a7; --brand:#625f8f; --brand-strong:#4f4c7a; --brand-soft:#f1f0f7; --brand-line:#dcdbea;
  --bg:#f7f7fb; --surface:#ffffff; --surface-2:#f8f8fb; --surface-3:#efeff5;
  --line:#e7e7ef; --line-strong:#d6d6e2; --ink:#1d1c2e; --ink-2:#4e4d63; --muted:#7f7e94;
  --hot:#d1432f; --hot-soft:#fdecea; --warm:#c27a06; --warm-soft:#fdf3e1; --cold:#2a78d6; --cold-soft:#e8f1fc;
  --ok:#14853b; --ok-soft:#e6f5eb; --danger:#c62f2f; --danger-soft:#fdecec; --ai:#6d4aff; --ai-soft:#f0ecff;
  --focus:#6d4aff; --r:12px; --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#a9a6d8; --brand-strong:#c3c1ea; --brand-soft:#26253a; --brand-line:#3a3954;
  --bg:#12121b; --surface:#1a1a26; --surface-2:#20202e; --surface-3:#282838;
  --line:#2c2c3e; --line-strong:#3a3a50; --ink:#ececf4; --ink-2:#c2c1d4; --muted:#9594ab;
  --hot:#ff8a78; --hot-soft:#3a2220; --warm:#f2b453; --warm-soft:#3a2f1a; --cold:#7fb2f5; --cold-soft:#1c2a3e;
  --ok:#6fd796; --ok-soft:#1b3324; --danger:#ff8a8a; --danger-soft:#3a1f22; --ai:#a993ff; --ai-soft:#29224a; --focus:#a993ff;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --brand:#a9a6d8; --brand-strong:#c3c1ea; --brand-soft:#26253a; --brand-line:#3a3954;
  --bg:#12121b; --surface:#1a1a26; --surface-2:#20202e; --surface-3:#282838;
  --line:#2c2c3e; --line-strong:#3a3a50; --ink:#ececf4; --ink-2:#c2c1d4; --muted:#9594ab;
  --hot:#ff8a78; --hot-soft:#3a2220; --warm:#f2b453; --warm-soft:#3a2f1a; --cold:#7fb2f5; --cold-soft:#1c2a3e;
  --ok:#6fd796; --ok-soft:#1b3324; --danger:#ff8a8a; --danger-soft:#3a1f22; --ai:#a993ff; --ai-soft:#29224a; --focus:#a993ff;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--brand)}
img{max-width:100%}

/* layout: sidebar + main; on phones the sidebar becomes a top bar with a scrolling tab row */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;flex:none}
.brand img{width:34px;height:34px;border-radius:8px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font-weight:550;text-align:left}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:650}
.nav-btn .ic{width:18px;text-align:center;flex:none}
.nav-btn .ct{margin-left:auto;background:var(--hot);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.side-foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:24px 28px 60px}
.page{max-width:1180px;margin:0 auto}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand{padding:0 8px 0 0}.brand div{display:none}
  .nav-btn{width:auto;white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  .main{padding:16px 16px 60px}
}

/* headings */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:24px;letter-spacing:-.02em;margin-right:auto}
.head p{margin:4px 0 0;color:var(--muted)}
h2{font-size:15px;margin:0}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sec h2{margin-right:auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#12121b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#12121b}}
.btn.primary:hover{background:var(--brand-strong)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.btn.ai:hover{border-color:var(--ai)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:wait}
.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
select.inp{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:550}
.chip:hover,.chip.on{border-color:var(--brand);color:var(--brand-strong);background:var(--brand-soft)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card+.card{margin-top:12px}
.grid2>.card,.flow>.card{margin-top:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h2{margin-right:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split,.grid2{grid-template-columns:minmax(0,1fr)}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--brand-line)}
.tile .n{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .t{color:var(--muted);font-size:12.5px;font-weight:550}
.tile.alert .n{color:var(--hot)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:650;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.hot{background:var(--hot-soft);color:var(--hot)} .pill.warm{background:var(--warm-soft);color:var(--warm)} .pill.cold{background:var(--cold-soft);color:var(--cold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.ai{background:var(--ai-soft);color:var(--ai)} .pill.brand{background:var(--brand-soft);color:var(--brand-strong)}
.score{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:650;font-size:12px}
.score i{display:block;width:44px;height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.score i b{display:block;height:100%;background:var(--brand)}

/* AI box */
.ai-box{background:var(--ai-soft);border-radius:10px;padding:12px 14px;color:var(--ink)}
.ai-box .ai-t{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ai);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ai-box p{margin:0;white-space:pre-wrap}

/* draft card */
.draft{border-left:4px solid var(--ai)}
.draft-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.draft-top .who{margin-right:auto;min-width:0}
.draft-top .who b{font-size:15px;cursor:pointer}
.draft-top .who b:hover{text-decoration:underline}
.draft-top .who small{display:block;color:var(--muted)}
.draft .why{font-size:13px;color:var(--ai);background:var(--ai-soft);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.draft .subj{font-weight:650}
.draft textarea{min-height:190px}
.draft .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.draft .acts .sp{flex:1}
.draft .err{color:var(--danger);font-size:12.5px;margin-top:6px}
.rewrite{margin-top:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}

/* lead table */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:0;background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--brand-soft);color:var(--brand-strong)}
.tab span{font-weight:500;opacity:.8;margin-left:3px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,1.4fr) 120px 150px minmax(0,1.6fr) 160px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow.h{cursor:default;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;padding-block:9px}
.lname{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname small{display:block;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.lnext{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ldate{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow>:nth-child(3),.lrow>:nth-child(4),.lrow>:nth-child(5){display:none}}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* lead page */
.lead-h{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:750;font-size:17px;flex:none}
.lead-h h1{margin:0;font-size:22px;letter-spacing:-.02em}
.lead-h .sub{color:var(--muted)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:6px 0;position:relative}
.stp .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--muted);z-index:1}
.stp.done .dot{background:var(--ok);color:#fff}
.stp.next .dot{background:var(--ai);color:#fff}
.stp:not(:last-child)::before{content:"";position:absolute;left:10.5px;top:28px;bottom:-6px;width:1px;background:var(--line-strong)}
.stp .g{font-size:12.5px;color:var(--ink-2)} .stp .w{font-size:11.5px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.msg.in{border-color:var(--cold);background:var(--cold-soft)}
.msg.note{background:var(--warm-soft);border-color:transparent}
.msg.skipped,.msg.failed{opacity:.6}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.msg .mh b{color:var(--ink);font-size:13px}
.msg .mb{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.msg details summary{cursor:pointer;color:var(--muted);font-size:12px}
.ev{font-size:12px;color:var(--muted);padding-left:14px;border-left:2px solid var(--line)}

/* ask claude */
.qa{display:flex;flex-direction:column;gap:12px}
.q{align-self:flex-end;background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:80%}
:root[data-theme="dark"] .q{color:#12121b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q{color:#12121b}}
.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:90%;white-space:pre-wrap}
.a .chips{margin-top:10px}
.thinking{color:var(--ai);font-weight:600}
.thinking::after{content:"…";animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:"."}50%{content:".."}100%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none}}

/* how it works */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:f}
.flow .card{position:relative;padding-top:40px}
.flow .card::before{counter-increment:f;content:counter(f);position:absolute;top:12px;left:16px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.flow .card b{display:block;margin-bottom:4px}
.flow .card p{margin:0;color:var(--ink-2);font-size:13px}
.flow .who{display:inline-block;margin-top:8px}

/* login, banners, toast */
.auth{max-width:400px;margin:10vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.auth img{width:48px;height:48px;border-radius:10px}
.auth h1{margin:0;font-size:22px}
.auth p{margin:0;color:var(--muted)}
.auth .err{color:var(--danger);font-size:13px;min-height:1em}
.code-inp{font-size:22px;letter-spacing:.35em;text-align:center}
.banner{padding:10px 14px;border-radius:10px;background:var(--ai-soft);color:var(--ink);font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warm-soft)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.setup ol{line-height:1.8;padding-left:20px}
code{background:var(--surface-3);border-radius:5px;padding:1px 5px;font-size:12.5px}
</style>
</head>
<body>
<div id="root"><p style="padding:24px">Loading Aurora Sales…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
